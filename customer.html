<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>백야 BAEK YA</title>
<script>
// 예전 백야 고객 페이지(신상·Best) 링크 → 야드북 새 주소로 넘김
(function () {
  var q = new URLSearchParams(location.search), n = new URLSearchParams();
  n.set('shop', 'baekya'); ['p', 's', 'i', 'to'].forEach(function (k) { if (q.get(k)) n.set(k, q.get(k)); });
  if (!n.get('p')) n.set('p', 'new');
  location.replace('https://yardbook.kr/customer.html?' + n.toString());
})();
</script></head>
<body style="font-family:sans-serif;text-align:center;padding:60px 20px;color:#555;">페이지 주소가 바뀌었어요. <a href="https://yardbook.kr/customer.html?shop=baekya&p=new">새 주소로 열기</a></body></html>
