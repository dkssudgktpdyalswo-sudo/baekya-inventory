<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>백야 장부</title>
<script>
// 예전 백야 장부 링크 → 야드북 새 주소로 그대로 넘김 (링크 번호·비밀번호는 같음)
(function () {
  var q = new URLSearchParams(location.search), t = q.get('t') || '';
  var u = 'https://yardbook.kr/ledger.html?shop=baekya' + (t ? '&t=' + encodeURIComponent(t) : '') + location.hash;
  location.replace(u);
})();
</script></head>
<body style="font-family:sans-serif;text-align:center;padding:60px 20px;color:#555;line-height:1.7;">장부 주소가 바뀌었어요. 잠시만 기다려 주세요.<br><a id="go" href="https://yardbook.kr/">새 주소로 열기</a>
<script>try { var q = new URLSearchParams(location.search); document.getElementById('go').href = 'https://yardbook.kr/ledger.html?shop=baekya&t=' + encodeURIComponent(q.get('t') || ''); } catch (e) {}</script></body></html>
